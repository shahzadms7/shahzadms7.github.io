<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-label="Tailscale / private connectivity"><title>Tailscale / private connectivity</title><desc>Identity-based connectivity across people, sites and cloud workloads.. Arrows show flow; dashed lines show feedback or cross-cutting controls.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34717e"/></marker><style>text{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700;fill:#12283e}.sub{font-size:14px;fill:#41546a}.label{font-size:17px;font-weight:700;fill:#12283e}.detail{font-size:13px;fill:#41546a}.edge{fill:none;stroke:#34717e;stroke-width:2.5;marker-end:url(#arrow)}.lane{font-size:12px;font-weight:700;letter-spacing:1px;fill:#34576f}</style></defs><rect width="1040" height="650" rx="18" fill="#f5f8fc"/><text x="30" y="40" class="title">Tailscale / private connectivity</text><text x="30" y="67" class="sub">Identity-based connectivity across people, sites and cloud workloads.</text><rect x="20" y="100" width="1000" height="135" rx="12" fill="#e6eef6" stroke="#bacbdc" stroke-dasharray="6 5"/><text x="36" y="122" class="lane">FOUNDATION / INPUTS</text><rect x="20" y="275" width="1000" height="135" rx="12" fill="#e6eef6" stroke="#bacbdc" stroke-dasharray="6 5"/><text x="36" y="297" class="lane">SERVICES / WORKFLOW</text><rect x="20" y="450" width="1000" height="135" rx="12" fill="#e6eef6" stroke="#bacbdc" stroke-dasharray="6 5"/><text x="36" y="472" class="lane">CONTROLS / OPERATIONS</text><path d="M315 180 H385" class="edge"/><path d="M655 180 H725" class="edge"/><path d="M520 225 V267.5 H180 V310" class="edge"/><path d="M520 225 V310" class="edge"/><path d="M860 225 V310" class="edge"/><path d="M180 400 V442.5 H520 V485" class="edge"/><path d="M520 400 V485" class="edge"/><path d="M860 400 V442.5 H520 V485" class="edge"/><path d="M315 530 H385" class="edge" stroke-dasharray="6 4"/><path d="M655 530 H7